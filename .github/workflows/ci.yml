name: CI

on:
  pull_request:
  push:
    branches: [main, codex/v2-social-commerce]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shilifangyuan_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/shilifangyuan_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Validate Render Blueprint
        working-directory: ${{ github.workspace }}
        run: python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('render.yaml').read_text())"
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Verify fresh migration upgrade
        run: alembic upgrade head
      - name: Verify full migration rollback
        run: alembic downgrade base
      - name: Verify migration re-upgrade
        run: alembic upgrade head
      - name: Verify PostgreSQL payment and invoice concurrency
        run: TEST_POSTGRES_URL="$DATABASE_URL" pytest pgtests -q --durations=10
      - name: Run pytest
        run: pytest -q --durations=20

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pip install -r backend/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Re-export the API route manifest
        working-directory: backend
        run: python -m scripts.export_openapi_paths ../web/src/lib/api.routes.json
      - name: Fail if the committed manifest is stale
        run: git diff --exit-code -- web/src/lib/api.routes.json
      - run: node --test tests/web-api-routes.test.mjs
