name: CI

on:
  pull_request:
  push:
    branches: [main, codex/v2-social-commerce]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=low
      - name: Export frontend dependency inventory
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --out frontend-dependency-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile-sbom
          path: frontend-dependency-sbom.cdx.json
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shilifangyuan_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shilifangyuan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/shilifangyuan_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python scripts/bootstrap_pip.py
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Validate Render Blueprint
        working-directory: ${{ github.workspace }}
        run: python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('render.yaml').read_text())"
      - name: Audit Python dependencies
        run: |
          audit_env="$RUNNER_TEMP/farm-dependency-audit"
          python -m venv "$audit_env"
          "$audit_env/bin/python" scripts/bootstrap_pip.py
          "$audit_env/bin/python" -m pip install pip-audit==2.10.1
          "$audit_env/bin/python" -m pip_audit --disable-pip --require-hashes -r requirements.txt --format cyclonedx-json --output dependency-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('backend/dependency-sbom.cdx.json') != '' }}
        with:
          name: backend-lockfile-sbom
          path: backend/dependency-sbom.cdx.json
      - name: Verify fresh migration upgrade
        run: alembic upgrade head
      - name: Verify full migration rollback
        run: alembic downgrade base
      - name: Verify migration re-upgrade
        run: alembic upgrade head
      - name: Verify pytest exit diagnostics controls
        run: |
          set -euo pipefail
          mkdir -p pytest-exit-evidence
          python -m pytest audits/test_pytest_exit_diagnostics.py --basetemp pytest-exit-evidence/controls -q
      - name: Verify PostgreSQL payment and invoice concurrency
        run: |
          set -euo pipefail
          mkdir -p pytest-exit-evidence
          TEST_POSTGRES_URL="$DATABASE_URL" python scripts/pytest_exit_diagnostics.py --evidence-dir pytest-exit-evidence/postgres -- pgtests -q --durations=10 2>&1 | tee pytest-exit-evidence/postgres.log
      - name: Run pytest
        run: |
          set -euo pipefail
          mkdir -p pytest-exit-evidence
          TEST_POSTGRES_URL="$DATABASE_URL" python scripts/pytest_exit_diagnostics.py --evidence-dir pytest-exit-evidence/full -- -q --durations=20 2>&1 | tee pytest-exit-evidence/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-exit-evidence
          path: backend/pytest-exit-evidence/
          if-no-files-found: warn
          retention-days: 7

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: python backend/scripts/bootstrap_pip.py
      - run: python -m pip install --require-hashes -r backend/requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: Re-export the API route manifest
        working-directory: backend
        run: python -m scripts.export_openapi_paths ../web/src/lib/api.routes.json
      - name: Fail if the committed manifest is stale
        run: git diff --exit-code -- web/src/lib/api.routes.json
      - run: node --test tests/web-api-routes.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      VITE_API_BASE_URL: ""
      BROWSER_TEST_URL: http://127.0.0.1:4192
      BROWSER_ENGINE: ${{ matrix.browser }}
      SESSION_EVIDENCE_DIR: browser-evidence/session
      CHECKOUT_EVENT_EVIDENCE_DIR: browser-evidence/checkout
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Record browser runtime
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          node --version | tee browser-evidence/runtime.log
          pnpm --version | tee -a browser-evidence/runtime.log
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee browser-evidence/install.log
      - name: Install matching browser and system dependencies
        run: |
          set -euo pipefail
          pnpm exec playwright --version | tee browser-evidence/playwright.log
          pnpm exec playwright install --with-deps "${{ matrix.browser }}" 2>&1 | tee browser-evidence/browser-install.log
      - name: Build isolated frontend
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee browser-evidence/build.log
      - name: Run isolated browser smoke
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node web/node_modules/vite/bin/vite.js preview web --host 127.0.0.1 --port 4192 --strictPort > browser-evidence/preview.log 2>&1 &
          smoke_preview_pid=$!
          cleanup() {
            kill "$smoke_preview_pid" 2>/dev/null || true
            wait "$smoke_preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:4192/ > /dev/null
          kill -0 "$smoke_preview_pid"
          browser_tests=(
            tests/browser/checkout-handoff.mjs
            tests/browser/checkout-recovery.mjs
            tests/browser/order-history.mjs
            tests/browser/payment-return-truth.mjs
            tests/browser/reconciliation-status.mjs
            tests/browser/admin-issues-access.mjs
            tests/browser/kitchen-access.mjs
            tests/browser/cloud-print-flow.mjs
          )
          if [[ "$BROWSER_ENGINE" == chromium ]]; then
            browser_tests+=(tests/browser/session-consistency.mjs tests/browser/line-customer-checkout.mjs)
          fi
          node --test --test-concurrency=1 --test-timeout=45000 "${browser_tests[@]}" 2>&1 | tee browser-evidence/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence-${{ matrix.browser }}
          path: browser-evidence/
          if-no-files-found: error
          retention-days: 7

  webkit-failure-diagnostic:
    needs: browser-smoke
    if: ${{ !cancelled() && needs.browser-smoke.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      VITE_API_BASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify diagnostic controls
        run: python -B -m unittest discover -s scripts/ci/tests -p 'test_run_wk01_native.py'
      - name: Install locked frontend and WebKit
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps webkit
      - name: Build isolated frontend
        run: pnpm build
      - name: Diagnose one original WebKit case
        timeout-minutes: 2
        run: python -B scripts/ci/run_wk01_native.py --evidence-dir browser-evidence/wk01-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-failure-diagnostic
          path: |
            browser-evidence/wk01-native/summary.json
            browser-evidence/wk01-native/timeline.json
            browser-evidence/wk01-native/manifest.json
          if-no-files-found: error
          retention-days: 7
