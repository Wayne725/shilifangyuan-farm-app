databases:
  - name: shilifangyuan-db
    plan: free
    region: singapore
    databaseName: shilifangyuan
    user: shilifangyuan

services:
  - type: web
    name: shilifangyuan-api
    branch: codex/v2-social-commerce
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: shilifangyuan-db
          property: connectionString
      - key: APP_ENV
        value: preview
      - key: APP_BASE_URL
        value: https://shilifangyuan-api.onrender.com
      - key: WEB_BASE_URL
        value: https://shilifangyuan-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: RECONCILE_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MEMBER_PASSWORD
        sync: false
      - key: DEMO_NONMEMBER_PASSWORD
        sync: false

  - type: web
    name: shilifangyuan-web
    branch: codex/v2-social-commerce
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://shilifangyuan-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
